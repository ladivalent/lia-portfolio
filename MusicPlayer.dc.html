<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/ebay-evo-design-system-61746ebd-3174-49cb-8cc6-28b2aefc2aa2/tokens/fonts.css">
  <style>
    body{margin:0}
    a{color:#0968F6}a:hover{color:#0049B8}
    .mp-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:32px;align-items:start}
    .mp-row:hover{background:#F7F7F7}
    @media (max-width:760px){
      .mp-grid{grid-template-columns:minmax(0,1fr) !important;gap:24px !important}
      .mp-cover{width:100% !important;max-width:320px}
    }
  </style>
</helmet>
<sc-if value="{{ show }}" hint-placeholder-val="{{ true }}">
<section data-screen-label="Music" style="font-family:'Market Sans',Inter,system-ui,sans-serif;color:#191919;padding:clamp(48px,8vw,96px) 24px;border-top:1px solid #E5E5E5">
  <div style="max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:32px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#0968F6">{{ eyebrow }}</div>
      <h2 style="margin:0;font-size:32px;line-height:1.15;font-weight:700;letter-spacing:-.01em">{{ title }}</h2>
      <sc-if value="{{ hasBlurb }}" hint-placeholder-val="{{ true }}"><p style="margin:0;font-size:17px;line-height:1.6;color:#545454;max-width:640px;text-wrap:pretty">{{ blurb }}</p></sc-if>
    </div>

    <sc-if value="{{ embedMode }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:16px;max-width:760px">
        <sc-for list="{{ embeds }}" as="e" hint-placeholder-count="1">
          <div style="border:1px solid #E5E5E5;border-radius:16px;overflow:hidden;background:#ffffff">
            <iframe src="{{ e.src }}" title="{{ e.frameTitle }}" width="100%" height="240" style="display:block;width:100%;height:240px;border:0;background:#191919" allow="autoplay; encrypted-media; fullscreen" loading="lazy"></iframe>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid #EDEDED">
              <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
                <span style="font-size:16px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ e.title }}</span>
                <span style="font-size:13px;line-height:1.4;color:#707070;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ e.note }}</span>
              </span>
              <a href="{{ e.link }}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:14px;font-weight:700;color:#0968F6;text-decoration:none;white-space:nowrap;flex:none">Open on Suno<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"></path><path d="M20 4 10 14"></path><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path></svg></a>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ nativeMode }}" hint-placeholder-val="{{ true }}">
    <div class="mp-grid" style="border:1px solid #E5E5E5;border-radius:16px;padding:24px;box-sizing:border-box">
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div class="mp-cover" style="width:272px;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#191919;display:flex;align-items:center;justify-content:center">
          <sc-if value="{{ hasCover }}" hint-placeholder-val="{{ false }}"><img src="{{ cover }}" alt="{{ coverAlt }}" style="display:block;width:100%;height:100%;object-fit:cover"></sc-if>
          <sc-if value="{{ noCover }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></sc-if>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
          <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#707070">Now playing</div>
          <div style="font-size:20px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ curTitle }}</div>
          <div style="font-size:14px;line-height:1.5;color:#545454">{{ artist }}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <button type="button" onClick="{{ prev }}" aria-label="Previous track" style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;border:1px solid #E5E5E5;background:#ffffff;color:#191919;cursor:pointer" style-hover="background:#F7F7F7"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM19 5v14l-10-7z"></path></svg></button>
          <button type="button" onClick="{{ toggle }}" aria-label="{{ toggleLabel }}" style="display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:999px;border:0;background:#191919;color:#ffffff;cursor:pointer" style-hover="background:#363636">
            <sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"></path></svg></sc-if>
            <sc-if value="{{ paused }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px"><path d="M8 5v14l11-7z"></path></svg></sc-if>
          </button>
          <button type="button" onClick="{{ next }}" aria-label="Next track" style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;border:1px solid #E5E5E5;background:#ffffff;color:#191919;cursor:pointer" style-hover="background:#F7F7F7"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5 5v14l10-7z"></path></svg></button>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div role="slider" aria-label="Position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ pct }}" tabIndex="0" onClick="{{ seek }}" onKeyDown="{{ seekKey }}" style="position:relative;height:24px;display:flex;align-items:center;cursor:pointer">
            <div style="width:100%;height:4px;border-radius:999px;background:#E5E5E5;overflow:hidden"><div style="width:{{ pctCss }};height:100%;background:#0968F6"></div></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:#707070;font-variant-numeric:tabular-nums"><span>{{ curTime }}</span><span>{{ durTime }}</span></div>
        </div>
        <sc-if value="{{ hasCurLink }}" hint-placeholder-val="{{ true }}"><a href="{{ curLink }}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:14px;font-weight:700;color:#0968F6;text-decoration:none;align-self:flex-start">Listen on Suno<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"></path><path d="M20 4 10 14"></path><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path></svg></a></sc-if>
      </div>

      <ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;min-width:0">
        <sc-for list="{{ rows }}" as="t" hint-placeholder-count="4">
          <li style="border-top:1px solid #EDEDED">
            <button type="button" class="mp-row" onClick="{{ t.pick }}" aria-current="{{ t.cur }}" style="display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 12px 8px 8px;border:0;border-radius:8px;background:{{ t.bg }};color:#191919;font-family:inherit;text-align:left;cursor:pointer;box-sizing:border-box">
              <span style="font-size:13px;font-weight:700;color:{{ t.numColor }};font-variant-numeric:tabular-nums;text-align:center">{{ t.num }}</span>
              <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
                <span style="font-size:16px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ t.title }}</span>
                <span style="font-size:13px;line-height:1.4;color:#707070;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ t.note }}</span>
              </span>
              <span style="font-size:13px;color:#707070;font-variant-numeric:tabular-nums">{{ t.length }}</span>
            </button>
          </li>
        </sc-for>
      </ol>
    </div>
    </sc-if>
    <audio id="lia-music-audio" preload="metadata" style="display:none"></audio>
  </div>
</section>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"eyebrow":{"editor":"text","default":"Off the clock · made with Suno","tsType":"string","section":"Copy"},"title":{"editor":"text","default":"Music","tsType":"string","section":"Copy"},"blurb":{"editor":"text","default":"","tsType":"string","section":"Copy"},"artist":{"editor":"text","default":"Lia DiValentin · made with Suno","tsType":"string","section":"Copy"},"cover":{"editor":"text","default":"","tsType":"string","section":"Tracks"},"tracks":{"editor":"text","default":"[]","tsType":"string","section":"Tracks"},"preview":{"editor":"boolean","default":false,"tsType":"boolean","section":"Tracks"},"$preview":{"width":1440,"height":560}}'>
class Component extends DCLogic {
  state = { cur: 0, playing: false, t: 0, d: 0, fell: false };
  tracks() {
    let list = [];
    try { list = JSON.parse(String(this.props.tracks ?? "[]")); } catch (e) { list = []; }
    if (!Array.isArray(list)) list = [];
    list = list.filter((x) => x && typeof x === "object").map((x) => ({
      title: String(x.title ?? ""), src: String(x.src ?? ""), blob: String(x.blob ?? ""), link: String(x.link ?? ""), note: String(x.note ?? ""), length: String(x.length ?? ""), suno: String(x.suno ?? "").trim()
    }));
    if (!list.length && this.props.preview) {
      list = [
        { title: "[Track title]", src: "", blob: "", link: "", note: "[one line about the track]", length: "0:00" },
        { title: "[Track title]", src: "", blob: "", link: "", note: "[one line about the track]", length: "0:00" },
        { title: "[Track title]", src: "", blob: "", link: "", note: "[one line about the track]", length: "0:00" }
      ];
    }
    return list;
  }
  audio() { return document.getElementById("lia-music-audio"); }
  componentDidMount() {
    const a = this.audio();
    if (!a) return;
    this._onTime = () => this.setState({ t: a.currentTime || 0, d: a.duration || 0 });
    this._onEnd = () => this.go(this.state.cur + 1, true);
    this._onErr = () => {
      const tr = this.tracks()[this.state.cur];
      if (tr && tr.blob && !this.state.fell) { this.setState({ fell: true }); a.src = tr.blob; if (this.state.playing) a.play().catch(() => {}); }
      else this.setState({ playing: false });
    };
    a.addEventListener("timeupdate", this._onTime);
    a.addEventListener("loadedmetadata", this._onTime);
    a.addEventListener("ended", this._onEnd);
    a.addEventListener("error", this._onErr);
    a.addEventListener("pause", () => this.setState({ playing: false }));
    a.addEventListener("play", () => this.setState({ playing: true }));
    this.load(0, false);
  }
  componentWillUnmount() {
    const a = this.audio();
    if (!a) return;
    a.removeEventListener("timeupdate", this._onTime);
    a.removeEventListener("loadedmetadata", this._onTime);
    a.removeEventListener("ended", this._onEnd);
    a.removeEventListener("error", this._onErr);
  }
  load(i, play) {
    const list = this.tracks();
    if (!list.length) return;
    const n = ((i % list.length) + list.length) % list.length;
    const tr = list[n];
    const a = this.audio();
    this.setState({ cur: n, t: 0, d: 0, fell: false });
    if (!a) return;
    const src = tr.src || tr.blob;
    if (!src) { this.setState({ playing: false }); return; }
    a.src = src;
    if (play) a.play().catch(() => this.setState({ playing: false }));
  }
  go(i, play) { this.load(i, play); }
  fmt(s) {
    if (!isFinite(s) || s < 0) return "0:00";
    const m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ":" + (r < 10 ? "0" : "") + r;
  }
  renderVals() {
    const list = this.tracks();
    const cur = Math.min(this.state.cur, Math.max(0, list.length - 1));
    const tr = list[cur] || { title: "", link: "" };
    const pct = this.state.d > 0 ? Math.round((this.state.t / this.state.d) * 100) : 0;
    const cover = String(this.props.cover ?? "").trim();
    const blurb = String(this.props.blurb ?? "").trim();
    const embedMode = list.length > 0 && list.every((x) => x.suno && !x.src && !x.blob);
    return {
      show: list.length > 0,
      embedMode: embedMode, nativeMode: list.length > 0 && !embedMode,
      embeds: list.map((x) => ({ title: x.title || "[Track title]", note: x.note, src: "https://suno.com/embed/" + x.suno, link: x.link || ("https://suno.com/song/" + x.suno), frameTitle: (x.title || "Track") + " on Suno" })),
      eyebrow: String(this.props.eyebrow ?? "Off the clock · made with Suno"),
      title: String(this.props.title ?? "Music"),
      blurb: blurb, hasBlurb: !!blurb,
      artist: String(this.props.artist ?? "Lia DiValentin · made with Suno"),
      cover: cover, hasCover: !!cover, noCover: !cover, coverAlt: "Cover art for " + String(this.props.title ?? "Music"),
      curTitle: tr.title || "[Track title]",
      curLink: tr.link, hasCurLink: !!tr.link,
      playing: this.state.playing, paused: !this.state.playing,
      toggleLabel: this.state.playing ? "Pause" : "Play",
      pct: pct, pctCss: pct + "%",
      curTime: this.fmt(this.state.t), durTime: this.state.d > 0 ? this.fmt(this.state.d) : (tr.length || "0:00"),
      rows: list.map((x, i) => ({
        num: i + 1, title: x.title || "[Track title]", note: x.note, length: x.length,
        cur: i === cur ? "true" : undefined, bg: i === cur ? "#F5F9FF" : "transparent", numColor: i === cur ? "#0968F6" : "#707070",
        pick: () => this.go(i, true)
      })),
      toggle: () => {
        const a = this.audio(); if (!a) return;
        if (!a.src || a.src === location.href) { this.load(cur, true); return; }
        if (a.paused) a.play().catch(() => {}); else a.pause();
      },
      prev: () => this.go(cur - 1, this.state.playing),
      next: () => this.go(cur + 1, this.state.playing),
      seek: (e) => {
        const a = this.audio(); if (!a || !this.state.d) return;
        const r = e.currentTarget.getBoundingClientRect();
        const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        a.currentTime = ratio * this.state.d;
      },
      seekKey: (e) => {
        const a = this.audio(); if (!a || !this.state.d) return;
        if (e.key === "ArrowRight") { e.preventDefault(); a.currentTime = Math.min(this.state.d, a.currentTime + 5); }
        if (e.key === "ArrowLeft") { e.preventDefault(); a.currentTime = Math.max(0, a.currentTime - 5); }
      }
    };
  }
}
</script>
</body>
</html>
