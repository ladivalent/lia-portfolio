<!DOCTYPE html>
<html>
<head>


<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
  <link rel="stylesheet" href="_ds/ebay-evo-design-system-61746ebd-3174-49cb-8cc6-28b2aefc2aa2/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/ebay-evo-design-system-61746ebd-3174-49cb-8cc6-28b2aefc2aa2/tokens/colors.css">
  <style>
    html,body{margin:0;height:100%;background:#fff;color:#191919;font-family:Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
    a{color:#0968F6}a:hover{color:#0049B8}
    :focus-visible{outline:2px solid #0968F6;outline-offset:2px}
    @media (max-width:640px){.vw-home{display:none !important}.vw-sub{display:none !important}.vw-title{align-items:flex-start !important;text-align:left}.vw-bar{padding:0 12px !important}}
  </style>
</helmet>
<div style="height:100vh;display:flex;flex-direction:column;font-family:Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;color:#191919">
  <div class="vw-bar" style="height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px;border-bottom:1px solid #E5E5E5;background:#fff">
    <a href="{{ backHref }}" style="display:inline-flex;align-items:center;gap:8px;height:44px;flex:none;padding:0 14px;border-radius:999px;border:1.5px solid #C7C7C7;background:#fff;color:#191919;font-size:14px;font-weight:700;text-decoration:none" style-hover="background:#F7F7F7;color:#191919">← Back</a>
    <div class="vw-title" style="display:flex;flex-direction:column;align-items:center;min-width:0;flex:1 1 auto"><div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">{{ title }}</div><div class="vw-sub" style="font-size:12px;color:#707070">Lia DiValentin · liadivalentin.com</div></div>
    <a class="vw-home" href="Home.dc.html" style="display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:700;color:#191919;text-decoration:none;white-space:nowrap">Lia DiValentin</a>
  </div>
  <div ref="{{ areaRef }}" style="flex:1;min-height:0;overflow:auto;background:#fff">
    <sc-if value="{{ isPlaybook }}" hint-placeholder-val="{{ true }}">
      <div style="max-width:1248px;margin:0 auto;padding:24px">
        <dc-import name="PlaybookViews" hint-size="100%,1400px"></dc-import>
      </div>
    </sc-if>
    <sc-if value="{{ isCollab }}" hint-placeholder-val="{{ false }}">
      <div style="height:100%;min-height:760px;position:relative">
        <dc-import name="CollabMap" style="display:block;width:100%;height:100%" hint-size="100%,900px"></dc-import>
      </div>
    </sc-if>
    <sc-if value="{{ isJourneys }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Size-Personalization-Journeys" hint-size="2016px,2280px"></dc-import>
    </sc-if>
    <sc-if value="{{ isPolicy }}" hint-placeholder-val="{{ false }}">
      <div style="width:100%;height:{{ boardH }};overflow:auto;position:relative;-webkit-overflow-scrolling:touch">
        <div style="position:relative;width:{{ boardW }};height:{{ boardH }}">
        <div style="position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;transform:{{ boardTf }}">
          <dc-import name="Agentic-Search-Policy-Map" embedded="{{ true }}" hint-size="1920px,1080px"></dc-import>
        </div>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ isFramework }}" hint-placeholder-val="{{ false }}">
      <div style="width:100%;height:{{ boardH }};overflow:auto;position:relative;-webkit-overflow-scrolling:touch">
        <div style="position:relative;width:{{ boardW }};height:{{ boardH }}">
        <div style="position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;transform:{{ boardTf }}">
          <dc-import name="Agentic-Search-Framework" embedded="{{ true }}" hint-size="1920px,1080px"></dc-import>
        </div>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ isCopyReview }}" hint-placeholder-val="{{ false }}">
      <div style="min-height:100%">
        <dc-import name="Copy-Review" hint-size="100%,1000px"></dc-import>
      </div>
    </sc-if>
    <sc-if value="{{ isPipeline }}" hint-placeholder-val="{{ false }}">
      <div style="min-height:100%">
        <dc-import name="Pipeline-Org-Chart" hint-size="100%,1000px"></dc-import>
      </div>
    </sc-if>
    <sc-if value="{{ isHd1 }}" hint-placeholder-val="{{ false }}">
      <div style="width:100%;height:100%;overflow:auto;-webkit-overflow-scrolling:touch"><div style="zoom:{{ hdZoom }};width:1280px;height:{{ hdH }}"><dc-import name="HD-Proto-Phase1" style="height:100%" hint-size="1280px,800px"></dc-import></div></div>
    </sc-if>
    <sc-if value="{{ isHd2 }}" hint-placeholder-val="{{ false }}">
      <div style="width:100%;height:100%;overflow:auto;-webkit-overflow-scrolling:touch"><div style="zoom:{{ hdZoom }};width:1280px;height:{{ hdH }}"><dc-import name="HD-Proto-Phase2" style="height:100%" hint-size="1280px,800px"></dc-import></div></div>
    </sc-if>
    <sc-if value="{{ isHd3 }}" hint-placeholder-val="{{ false }}">
      <div style="width:100%;height:100%;overflow:auto;-webkit-overflow-scrolling:touch"><div style="zoom:{{ hdZoom }};width:1280px;height:{{ hdH }}"><dc-import name="HD-Proto-Phase3" style="height:100%" hint-size="1280px,800px"></dc-import></div></div>
    </sc-if>
    <sc-if value="{{ isFrame }}" hint-placeholder-val="{{ false }}">
      <iframe src="{{ src }}" title="{{ title }}" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" style="display:block;width:100%;height:100%;border:0;background:#fff"></iframe>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"slot":{"editor":"enum","default":"playbook","options":["playbook","collab-map","size-journeys","agentic-policy-map","agentic-framework","copy-review","pipeline-org-chart","hd-phase-1","hd-phase-2","hd-phase-3"]},"back":{"editor":null}}'>
class Component extends DCLogic {
  state = { entry: null, areaW: 1280, areaH: 800 };
  areaRef = React.createRef();
  pick() {
    const q = new URLSearchParams(location.search);
    let saved = {};
    try { saved = JSON.parse(sessionStorage.getItem("lia-view") || "{}") || {}; } catch (_) {}
    return { slot: q.get("slot") || this.props.slot || saved.slot || "playbook", back: q.get("back") || this.props.back || saved.back || "Process.dc.html" };
  }
  componentDidMount() {
    fetch("embeds.json").then(r => r.json()).then(m => this.setState({ entry: (m.slots || {})[this.pick().slot] || null })).catch(() => {});
    const measure = () => { const el = this.areaRef.current; this.setState({ areaW: (el && el.clientWidth) || window.innerWidth, areaH: (el && el.clientHeight) || (window.innerHeight - 56) }); };
    this._onResize = measure;
    window.addEventListener("resize", measure);
    setTimeout(measure, 50);
  }
  componentWillUnmount() { window.removeEventListener("resize", this._onResize); }
  renderVals() {
    const slot = this.pick().slot;
    const back = this.pick().back;
    const e = this.state.entry;
    const titles = { "playbook": "UX Playbook", "collab-map": "Interactive Collaboration Map", "size-journeys": "Interactive User Journey Mapping", "agentic-policy-map": "Agentic Search Policy Map", "agentic-framework": "Agentic Search Framework", "copy-review": "Copy Review Template", "pipeline-org-chart": "Pipeline Org Chart", "hd-phase-1": "Purchase Approvals · Phase 1 · Account owner sets up a workflow", "hd-phase-2": "Purchase Approvals · Phase 2 · Requester submits an order request", "hd-phase-3": "Purchase Approvals · Phase 3 · Approver reviews an order request" };
    const inline = Object.prototype.hasOwnProperty.call(titles, slot);
    const src = !inline && e && e.source ? (e.source.mode === "url" ? e.source.url + (e.source.params || "") : e.source.file) : undefined;
    const areaW = this.state.areaW || 1280;
    // Phones: never shrink the 1920px boards below half size; the frame scrolls sideways instead.
    const s = areaW < 760 ? Math.max(0.5, Math.min(1, areaW / 1920)) : Math.min(1, areaW / 1920);
    const areaH = this.state.areaH || (window.innerHeight - 56);
    // The 1280px Home Depot prototypes follow the same rule: half size at most on phones, then the frame scrolls sideways.
    const hdZoom = areaW < 760 ? Math.max(0.5, Math.min(1, areaW / 1280)) : Math.min(1, areaW / 1280);
    return {
      areaRef: this.areaRef,
      title: titles[slot] || (e && e.title) || "",
      isPlaybook: slot === "playbook", isCollab: slot === "collab-map", isJourneys: slot === "size-journeys",
      isPolicy: slot === "agentic-policy-map", isFramework: slot === "agentic-framework",
      isCopyReview: slot === "copy-review", isPipeline: slot === "pipeline-org-chart",
      isHd1: slot === "hd-phase-1", isHd2: slot === "hd-phase-2", isHd3: slot === "hd-phase-3",
      hdZoom: hdZoom.toFixed(4), hdH: Math.round(Math.max(600, areaH) / hdZoom) + "px",
      isFrame: !inline && !!src, src,
      boardTf: "scale(" + s.toFixed(4) + ")", boardH: Math.round(1080 * s) + "px", boardW: Math.round(1920 * s) + "px",
      backHref: /^[\w .%-]+\.dc\.html(\?.*)?$/.test(back) ? back : "Process.dc.html",
    };
  }
}
</script>
</body>
</html>
