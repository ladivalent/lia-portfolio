html,body{margin:0;background:#fff;font-family:var(--font-brand);color:#191919}
#root{display:flex;justify-content:center;align-items:flex-start;width:100%;min-height:100vh}
#root>div{transform-origin:top center}
*{box-sizing:border-box}
a{color:#191919}a:hover{color:#0968f6}
body[data-platform="mobile"]{background:#f7f7f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
:focus-visible{outline:2px solid #0968f6;outline-offset:2px}
/* ListingCard: pin the condition line to one row so prices share a baseline across a 3-up row */
.aim-pc p + span{display:block;height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aim-scroll::-webkit-scrollbar{display:none}
.aim-dry{min-width:0;max-width:100%;overflow-x:hidden}
.aim-dry *{max-width:100%;box-sizing:border-box}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
  function fit(){
    var el=document.querySelector('#root>div'); if(!el) return;
    var w=el.offsetWidth; var s=Math.min(1,window.innerWidth/w);
    el.style.transform=s<1?'scale('+s+')':'';
    el.style.marginBottom=s<1?(-(el.offsetHeight*(1-s)))+'px':'';
  }
  var ro=new MutationObserver(fit); ro.observe(document.getElementById('root'),{childList:true,subtree:false});
  window.addEventListener('resize',fit); window.addEventListener('hashchange',function(){setTimeout(fit,50)}); setTimeout(fit,300);
})();
</script>
